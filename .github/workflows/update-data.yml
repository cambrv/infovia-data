name: Actualizar datos de InfoVia EC
on:
  push:
    branches: [main]
    paths-ignore:
      - 'data/**'
      - 'catalog/**'
      - 'README.md'
  schedule:
    - cron: '3,8,13,18,23,28,33,38,43,48,53,58 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: portal-ecuador-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Comprobar antigüedad de los datos publicados
        id: cadence
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, appendFileSync } from 'node:fs';
          let refresh = true;
          if (process.env.GITHUB_EVENT_NAME === 'schedule') {
            try {
              const manifest = JSON.parse(readFileSync('data/manifest.json', 'utf8'));
              const last = Date.parse(manifest.generatedAt);
              const age = Date.now() - last;
              if (Number.isFinite(age) && age >= 0 && age < 15 * 60_000) {
                refresh = false;
                console.log('Últimos datos publicados hace menos de 15 minutos; se omite esta ejecución.');
              }
            } catch (error) {
              console.warn('No se pudo verificar el manifiesto; se intentará extraer:', error.message);
            }
          }
          appendFileSync(process.env.GITHUB_OUTPUT, 'refresh=' + refresh + '\n');
          if (refresh) console.log('Corresponde ejecutar la extracción y publicación.');
          NODE
      - run: npm ci --ignore-scripts
        if: steps.cadence.outputs.refresh == 'true'
      - run: npm run check && npm test
        if: steps.cadence.outputs.refresh == 'true'
      - name: Extraer, validar y publicar sin sobrescribir cambios concurrentes
        if: steps.cadence.outputs.refresh == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          for intento in 1 2 3; do
            echo "Intento de publicación ${intento}/3"
            # Solo se descarta el estado local efímero del runner; nunca se fuerza el remoto.
            git fetch origin main
            git reset --hard origin/main

            # Reextraer tras sincronizar: preserva validaciones frente al último JSON publicado.
            npm run sync
            git add data/ catalog/
            if git diff --cached --quiet; then
              echo "Sin cambios para publicar."
              exit 0
            fi

            git commit -m 'data: actualizar Portal Ecuador'
            if git push origin HEAD:main; then
              echo "Publicación correcta."
              exit 0
            fi
            echo "Push rechazado. Se volverá a extraer desde el HEAD remoto actual."
            sleep 3
          done

          echo "::error::No se pudo publicar tras tres intentos. El remoto conserva su último snapshot válido."
          exit 1
