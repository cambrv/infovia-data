name: Actualizar datos de InfoVia EC
on:
  push:
    branches: [main]
    paths-ignore:
      - 'data/**'
      - 'catalog/**'
      - 'README.md'
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: portal-ecuador-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check && npm test
      - name: Extraer Portal Ecuador y validar las geometrías
        run: npm run sync
      - name: Publicar únicamente una extracción completa y válida
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/ catalog/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'data: actualizar Portal Ecuador'
          git push origin HEAD:main
